# Projection assumptions (economy) — editable, like the law spec.
#
# Each variable is a yearly growth rate: the change from the previous year to `year`.
# Paths come from inputs/fl_economy_paths.csv (built by scripts/fl_economy_inputs.py from the
# official Florida forecasts) unless a scenario overrides them.
#
# Scenario overrides, per variable:
#   source: <name>          use another forecast from the paths file (e.g. rec_edr, rec_fea)
#   set: {year: rate}       replace specific years
#   shift: rate             add to every year (e.g. -0.01 = one point lower)
# Years past a forecast's end follow `after_forecast`.

meta:
  state: FL
  base_year: 2026
  end_year: 2036
  decided: "2026-10-15 (Daniel): central home values = REC adopted forecast; 2033-36 ease to the
    EEC median sale-price path; Florida-specific forecasts where available; inflation national CPI
    (the statutes use the national CPI) and adjustable later."

variables:
  home_value:
    description: Market value growth of existing homes (all residential, homestead and not;
      new construction excluded).
    paths_variable: appreciation_residential
    source: rec_adopted
    source_note: Revenue Estimating Conference, Ad Valorem, July 31 / Aug 3, 2026 (adopted forecast, 2027-2032)
    after_forecast: {method: ease_to, target_variable: median_price_single_family,
                     target_source: fl_eec_2026_07, years: 4}

  nonresidential_value:
    description: Market value growth of existing non-residential property (needed for rolled-back rates).
    paths_variable: appreciation_nonresidential
    source: rec_adopted
    source_note: Revenue Estimating Conference, Ad Valorem, Aug 2026 (adopted forecast, 2027-2032)
    after_forecast: {method: hold}

  wage:
    description: Wage and self-employment income growth (Florida average annual wage).
    paths_variable: average_wage
    source: fl_eec_2026_07
    source_note: Florida Economic Estimating Conference, July 17, 2026, long-run tables (fiscal years)

  other_income:
    description: Interest, dividends and other income (Florida personal income per household).
    paths_variable: personal_income_per_household
    source: fl_eec_2026_07
    source_note: Florida Economic Estimating Conference, July 17, 2026 (personal income / households)

  households:
    description: Number of Florida households.
    paths_variable: households
    source: fl_eec_2026_07
    source_note: Florida Demographic Estimating Conference, June 2026 (in the EEC long-run tables)

  cpi:
    description: National CPI-U inflation. Drives the Save Our Homes cap (lesser of 3% or CPI),
      exemption indexing, and Social Security, SSI, public assistance and pension growth.
    values: {2026: 0.029, 2027: 0.023, 2028: 0.023, 2029: 0.023, 2030: 0.023, 2031: 0.023, 2032: 0.023,
             2033: 0.023, 2034: 0.023, 2035: 0.023, 2036: 0.023}
    source_note: CBO, Budget and Economic Outlook 2026 to 2036 (Feb 2026) - CPI-U 2.9% in 2026 (sets the
      2027 Save Our Homes cap), 2.3% a year on average after.
      To do - average with the Social Security Trustees and the Philadelphia Fed SPF 10-year CPI.

# Income components and the variable each grows with.
income_growth:
  wagp_aged: wage
  semp_aged: wage
  intp_aged: other_income
  oip_aged: other_income
  ssp_aged: cpi
  ssip_aged: cpi
  pap_aged: cpi
  retp_aged: cpi

# Home sales (changes of ownership) and portability, per year.
turnover:
  homestead_sale_rate: 0.055
  nonhomestead_sale_rate: 0.084
  sale_rate_note: Yearly share of homes whose assessment resets on a change of ownership.
    Calibrated (2026-10-15) so homestead Save Our Homes savings follow the Revenue Estimating
    Conference's homestead differential forecast for 2027-2032 (mean gap -0.2 to -0.8 points a year
    for 5-6%; 2032 assessed/just 0.64-0.66 vs REC 0.661). The rolls record transfers of 8.0% of
    homesteads and 12.2% of other homes in 2025, but over a third of transfers are not
    arm's-length sales and many (to a spouse, into a trust) don't reset the assessment; standard
    sales are about 5.2% of residential parcels. Non-homestead rate scaled by the same ratio.
  lock_in:
    per_100k_savings: -0.0625
    floor: 0.5
    note: Each $100,000 of Save Our Homes savings lowers the chance of selling by 6.25% (relative),
      not below half the base rate (UF Shimberg Center for EDR, 2007, Broward single-family).
      The base rate is set so the 2026 average matches the sale rates above.
  portability:
    share_of_homestead_sales: 0.14
    max_transfer: 500000
    note: 14% of 2025 buyers who are 2026 homesteaders carried over a Save Our Homes benefit
      (ASS_DIF_TRNS > 0); median $106,024. In the model a household that sells and ports keeps its
      own savings (up to $500,000) on its next home.

# How governments set millage each year (ptm/rate_setting.py). Options:
#   history      draw each government's yearly rate change from what Florida governments of the
#                same type did in years with similar base growth (counties 1996-2025, cities
#                2009-2025, school districts 1997-2025), capped at cap_multiple x rolled-back
#                except with exceed_cap_probability. Central path = mean of the draws.
#   keep_capped  keep last year's rate, cut to cap_multiple x the rolled-back rate if above it
#   rolled_back  the rolled-back rate every year (revenue-neutral on existing property)
#   hold         last year's rate
rate_setting:
  county: history
  municipal: history
  school_rle: history
  cap_multiple: 1.10
  exceed_cap_probability: 0.03
  draws: 200
  history_neighbors: 60
  seed: 2026
  decided: "2026-10-15 (Daniel): history-based draws (rate changes from Florida's own record), with the
    2026 law's 110% cap, exceeded 3% of the time (1 of 33 counties did in 2026). keep_capped,
    rolled_back and hold stay available."

# Monte Carlo noise around a scenario's path (ptm/montecarlo.py): yearly normal shocks to growth
# rates, with persistence (AR(1)) and home / non-residential correlation.
uncertainty:
  home_value_sd: 0.037
  nonresidential_sd: 0.03
  cpi_sd: 0.0057
  persistence: 0.5
  home_nonres_correlation: 0.7
  note: Home value and CPI spreads from the UF Shimberg Center study for EDR (2007) - Florida real
    house price growth sd 3.2-4.0 points a year across its regimes (3.7 used), CPI sd 0.57 points.
    Non-residential spread, persistence and correlation are judgment, to be checked against
    history.

scenarios:
  central:
    description: Official Florida forecasts (REC adopted, EEC).

  low:
    description: Slower home prices - the Legislature's economists' (EDR) proposal to the conference.
    home_value: {source: rec_edr}
    nonresidential_value: {source: rec_edr}

  high:
    description: Faster home prices - the Governor's office (FEA) proposal to the conference.
    home_value: {source: rec_fea}
    nonresidential_value: {source: rec_fea}

  stall:
    description: The economy stalls for three years - flat home values, slow wages - then official
      growth rates resume (levels stay lower).
    home_value: {set: {2027: 0.0, 2028: 0.0, 2029: 0.0}}
    nonresidential_value: {set: {2027: 0.0, 2028: 0.0, 2029: 0.0}}
    wage: {set: {2027: 0.02, 2028: 0.02, 2029: 0.02}}
    other_income: {set: {2027: 0.01, 2028: 0.01, 2029: 0.01}}

  downturn:
    description: A housing downturn shaped like the Federal Reserve's 2026 severely adverse stress
      scenario (home prices about 30% lower over two years), then official growth rates resume.
      The Fed path is national; Florida's could be deeper or shallower.
    home_value: {set: {2027: -0.163, 2028: -0.163}}
    nonresidential_value: {set: {2027: -0.10, 2028: -0.10}}
    wage: {set: {2027: 0.01, 2028: 0.01}}
    other_income: {set: {2027: -0.02, 2028: 0.0}}
